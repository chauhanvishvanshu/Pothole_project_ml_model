<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pothole Detection Dashboard</title>

  <!-- Google Font (Inter) + Font Awesome for icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* THEME COLORS (derived from the provided Tailwind-like file) */
    :root {
      --primary-600: #1d4ed8; /* primary */
      --primary-700: #1e3a8a; /* secondary */
      --bg: #f8fafc; /* light neutral */
      --surface: #ffffff;
      --muted: #f1f5f9;
      --card-border: rgba(30,58,138,0.06);
      --accent: #06b6d4;
      --success: #16a34a;
      --danger: #ef4444;
      --text-900: #0f172a;
      --text-600: #475569;
    }

    /* Base */
    html,body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #f1f5f9 0%, #eef2ff 100%);
      color: var(--text-900);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height: 1.4;
    }

    /* Header */
    .header {
      background: linear-gradient(90deg,var(--primary-600),var(--primary-700));
      color: #fff;
      padding: 18px 12px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(30,58,138,0.08);
    }
    .header h1 { margin: 0; font-weight:700; letter-spacing: -0.5px; font-size: 1.35rem; }
    .header p { margin: 4px 0 0; font-size: 0.9rem; opacity: 0.92; }

    /* Layout */
    .container {
      max-width: 1280px;
      margin: 26px auto;
      padding: 18px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .left { flex: 2; min-width: 320px; }
    .right { flex: 1; min-width: 280px; align-self: flex-start; }

    /* Cards */
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.04);
      border: 1px solid var(--card-border);
    }

    /* Upload row */
    .upload { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="file"] { padding: 6px; border-radius: 8px; border: 1px solid #e6eefc; background: linear-gradient(180deg,#fff,#fbfdff); }

    /* Buttons */
    .btn {
      background: linear-gradient(90deg,var(--primary-600),var(--primary-700));
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(30,58,138,0.12);
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled, .btn[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; transform: none; }

    .btn.export { background: linear-gradient(90deg,#10b981,#059669); box-shadow: 0 6px 16px rgba(6,182,129,0.12); }

    /* Video area */
    .video {
      width: 100%;
      border-radius: 12px;
      border: 3px solid rgba(29,78,216,0.12);
      overflow: hidden;
      background: linear-gradient(180deg,#f8fafc,#ffffff);
    }
    .video img { display: block; width: 100%; height: auto; }

    /* Stats */
    .stats-list { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
    .stat {
      background: linear-gradient(180deg,#fbfdff,#f8fafc);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border: 1px solid rgba(2,6,23,0.03);
    }
    .stat strong { color: var(--text-600); font-weight:600; }

    footer {
      margin-top: 28px;
      background: linear-gradient(90deg,var(--primary-600),var(--primary-700));
      color: #fff;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
    }
    #eta { font-weight: 700; color: var(--primary-700); }

    /* Small screens adjustments */
    @media (max-width: 920px) {
      .container { padding: 12px; }
      .left, .right { min-width: 100%; flex: 1 1 100%; }
      .upload { flex-direction: column; align-items:stretch; }
    }

    /* subtle helper */
    .muted { color: var(--text-600); }
    .small { font-size: 0.85rem; color: var(--text-600); }
  </style>
</head>

<body>
  <header class="header">
    <h1>Pothole Detection</h1>
    <p>Real-time YOLO detection • Multi-session Backend</p>
  </header>

  <main class="container">
    <section class="left">
      <div class="card">
        <form id="uploadForm" class="upload" enctype="multipart/form-data">
          <input type="text" name="start_coords" id="start_coords"
            placeholder="Start GPS (lat,lon) — optional"
            style="padding:8px;border-radius:8px;border:1px solid #e6eefc;width:180px;">

          <input type="text" name="end_coords" id="end_coords"
            placeholder="End GPS (lat,lon) — optional"
            style="padding:8px;border-radius:8px;border:1px solid #e6eefc;width:180px;">

          <input type="file" id="videoFile" name="video" accept="video/*" required />
          <button class="btn" type="submit">Upload & Run</button>
        </form>

        <div class="video" aria-hidden="false">
          <img id="videoFeed" src="" alt="Video feed" onerror="retryStream()" />
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <h2 style="color:var(--primary-700);margin:0 0 10px">Live Statistics</h2>

        <div class="stats-list">
          <div class="stat"><strong>Status:</strong> <span id="status">Idle</span></div>
          <div class="stat"><strong>Detections:</strong> <span id="detection-count">0</span></div>
          <div class="stat"><strong>Total Area (m²):</strong> <span id="live-area">0.00</span></div>
          <div class="stat"><strong>Avg Confidence:</strong> <span id="avg-conf">0.00</span></div>
          <div class="stat"><strong>Video FPS:</strong> <span id="video-fps">0.00</span></div>
          <div class="stat"><strong>Processing FPS:</strong> <span id="proc-fps">0.00</span></div>
          <div class="stat"><strong>ETA:</strong> <span id="eta">--:--</span></div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
          <a id="manualExport" class="btn export" href="#"
             style="pointer-events:none;opacity:0.6;" target="_blank">Export CSV</a>

          <a id="downloadArchive" class="btn" href="#"
             style="background:#64748b;pointer-events:none;opacity:0.6;" target="_blank">Download Archive</a>

          <a id="exportPDF" class="btn" href="#"
             style="background:linear-gradient(90deg,#0ea5e9,#6366f1);pointer-events:none;opacity:0.6;" target="_blank">Export PDF</a>

          <a id="exportKML" class="btn" href="#"
             style="background:linear-gradient(90deg,#7c3aed,#a78bfa);pointer-events:none;opacity:0.6;" target="_blank">Export KML</a>
        </div>

        <div id="mapPreviewBox" class="stat" style="display:none;margin-top:15px;">
          <strong>GPS Map:</strong><br>
          <iframe id="kmlMap"
                  style="width:100%;height:220px;border:1px solid rgba(2,6,23,0.04);border-radius:8px;"
                  src="">
          </iframe>
        </div>
      </div>
    </aside>
  </main>

  <footer>© 2025 Pothole Vision System</footer>

  <script>
    /* ==== NOTE: LOGIC REMAINS EXACTLY THE SAME AS BEFORE ====
       Only styling and fonts were changed above.
       All JS, IDs, endpoints and behaviour preserved.
    */

    // ---------------- BACKEND AUTO-SELECTION ----------------
    function detectBackend() {
      const host = window.location.hostname;

      if (host === "localhost" || host === "127.0.0.1" || window.location.protocol === "file:")
        return "http://127.0.0.1:7860";

      if (host.endsWith(".netlify.app"))
        return "https://YOUR-HF-SPACE.hf.space";

      if (host.endsWith(".hf.space"))
        return window.location.origin;

      return "http://127.0.0.1:7860";
    }

    const backend = detectBackend();
    console.log("Using backend:", backend);

    let sessionId = null;

    const statusEl = document.getElementById("status");
    const videoFeed = document.getElementById("videoFeed");
    const manualExport = document.getElementById("manualExport");
    const downloadArchive = document.getElementById("downloadArchive");

    // ---------------- UTILITIES ----------------
    async function fetchJSON(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return { error: true };
        return res.json();
      } catch {
        return { error: true };
      }
    }

    function safeFixed(v, d = 2) {
      v = Number(v);
      return isFinite(v) ? v.toFixed(d) : "0.00";
    }

    function formatETA(s) {
      if (!s || s < 0) return "--:--";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
    }

    function resetUI() {
      document.getElementById("detection-count").textContent = "0";
      document.getElementById("live-area").textContent = "0.00";
      document.getElementById("avg-conf").textContent = "0.00";
      document.getElementById("video-fps").textContent = "0.00";
      document.getElementById("proc-fps").textContent = "0.00";
      document.getElementById("eta").textContent = "--:--";
      videoFeed.src = "";
      // hide map preview when new upload starts
      document.getElementById("mapPreviewBox").style.display = "none";
      document.getElementById("kmlMap").src = "";
    }

    function retryStream() {
      if (sessionId) {
        videoFeed.src = `${backend}/video_feed/${sessionId}?t=${Date.now()}`;
      }
    }

    function resolveUrl(maybeUrl) {
      if (!maybeUrl) return null;
      if (maybeUrl.startsWith("http://") || maybeUrl.startsWith("https://")) return maybeUrl;
      if (maybeUrl.startsWith("/")) {
        return backend.replace(/\/$/, "") + maybeUrl;
      }
      return backend.replace(/\/$/, "") + "/" + maybeUrl;
    }

    // ---------------- UPLOAD HANDLER ----------------
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const videoFile = document.getElementById("videoFile").files[0];
      if (!videoFile) return alert("Please select a video.");

      resetUI();

      const disableBtn = (el) => { el.style.pointerEvents = "none"; el.style.opacity = "0.6"; };
      const enableBtn = (el) => { el.style.pointerEvents = "auto"; el.style.opacity = "1"; };

      disableBtn(manualExport);
      disableBtn(downloadArchive);
      disableBtn(document.getElementById("exportPDF"));
      disableBtn(document.getElementById("exportKML"));

      statusEl.textContent = "Uploading...";

      const fd = new FormData();
      fd.append("video", videoFile);

      const startC = document.getElementById("start_coords").value.trim();
      const endC = document.getElementById("end_coords").value.trim();
      if (startC) fd.append("start_coords", startC);
      if (endC) fd.append("end_coords", endC);

      try {
        const res = await fetch(`${backend}/upload`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Idle";
          return alert("Upload failed: " + JSON.stringify(data));
        }

        sessionId = data.session_id;
        statusEl.textContent = "Processing...";
        retryStream();
      } catch (err) {
        console.error(err);
        alert("Upload failed.");
        statusEl.textContent = "Idle";
      }
    });

    // ---------------- POLLING ----------------
    async function refreshStats() {
      if (!sessionId) return;

      const det = await fetchJSON(`${backend}/detection_count/${sessionId}`);
      if (!det.error) {
        document.getElementById("detection-count").textContent = det.detections ?? 0;
        document.getElementById("live-area").textContent = safeFixed(det.total_area ?? 0);
        document.getElementById("avg-conf").textContent = safeFixed(det.avg_confidence ?? 0);
      }

      const prog = await fetchJSON(`${backend}/progress/${sessionId}`);
      if (!prog.error) {
        // If you have a progress widget elsewhere, you can update it externally
        document.getElementById("video-fps").textContent = safeFixed(prog.video_fps ?? 0);
        document.getElementById("proc-fps").textContent = safeFixed(prog.processing_fps ?? 0);
        document.getElementById("eta").textContent = formatETA(prog.estimated_time_left_s);
      }

      const proc = await fetchJSON(`${backend}/processing_status/${sessionId}`);
      if (!proc.error) statusEl.textContent = proc.processing ? "Processing..." : "Idle";

      const last = await fetchJSON(`${backend}/last_report/${sessionId}`);

      // enable CSV
      if (!last.error && last.csv_url) {
        manualExport.href = resolveUrl(last.csv_url);
        manualExport.style.pointerEvents = "auto";
        manualExport.style.opacity = "1";
      }

      // enable ZIP archive
      if (!last.error && last.archive_url) {
        downloadArchive.href = resolveUrl(last.archive_url);
        downloadArchive.style.pointerEvents = "auto";
        downloadArchive.style.opacity = "1";
      }

      // enable PDF
      if (!last.error && last.pdf_url) {
        const pdfBtn = document.getElementById("exportPDF");
        pdfBtn.href = resolveUrl(last.pdf_url);
        pdfBtn.style.pointerEvents = "auto";
        pdfBtn.style.opacity = "1";
      }

      // enable KML and preview
      if (!last.error && last.kml_url) {
        const kmlBtn = document.getElementById("exportKML");
        const kmlResolved = resolveUrl(last.kml_url);
        kmlBtn.href = kmlResolved;
        kmlBtn.style.pointerEvents = "auto";
        kmlBtn.style.opacity = "1";

        const mapBox = document.getElementById("mapPreviewBox");
        const mapFrame = document.getElementById("kmlMap");
        mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(kmlResolved)}`;
        mapBox.style.display = "block";
      }
    }

    setInterval(refreshStats, 1000);
    refreshStats();
  </script>
</body>
</html>
