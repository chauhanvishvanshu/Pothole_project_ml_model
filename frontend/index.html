<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pothole Detection Dashboard</title>

  <style>
    :root {
      --blue: #0055ff;
      --muted: #f4f6f8;
      --card: #ffffff;
      --success: #28a745;
      --warning: #ffb100;
      --danger: #dc3545;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--muted);
      color: #222;
    }
    .header {
      background: var(--blue);
      color: #fff;
      padding: 18px 12px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }
    .container {
      max-width: 1280px;
      margin: 26px auto;
      padding: 16px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .left { flex: 2; min-width: 320px; }
    .right { flex: 1; min-width: 280px; align-self: flex-start; }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(15, 15, 15, 0.06);
      border: 1px solid var(--blue);
    }
    .upload { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .btn {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.export { background: var(--success); }
    .video { width: 100%; border-radius: 8px; border: 3px solid var(--blue); overflow: hidden; }
    .video img { display: block; width: 100%; height: auto; }
    .stats-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .stat { background: #f8f9fa; padding: 10px; border-radius: 8px; font-size: 0.98rem; }
    .stat strong { display: inline-block; width: 150px; color: #111; }
    footer {
      margin-top: 28px;
      background: var(--blue);
      color: #fff;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
    }
    #eta { font-weight: 700; color: var(--blue); }
  </style>
</head>

<body>
  <header class="header">
    <h1>Pothole Detection</h1>
    <p>Real-time YOLOv12 detection • Multi-session Backend</p>
  </header>

  <main class="container">
    <section class="left">
      <div class="card">
        <form id="uploadForm" class="upload" enctype="multipart/form-data">
          <input type="file" id="videoFile" name="video" accept="video/*" required />
          <button class="btn" type="submit">Upload & Run</button>
        </form>

        <div class="video">
          <img id="videoFeed" src="" alt="Video feed" onerror="retryStream()" />
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <h2 style="color:var(--blue);margin:0 0 10px">Live Statistics</h2>

        <div class="stats-list">
          <div class="stat"><strong>Status:</strong> <span id="status">Idle</span></div>
          <div class="stat"><strong>Detections:</strong> <span id="detection-count">0</span></div>
          <div class="stat"><strong>Total Area (m²):</strong> <span id="live-area">0.00</span></div>
          <div class="stat"><strong>Avg Confidence:</strong> <span id="avg-conf">0.00</span></div>
          <div class="stat"><strong>Video FPS:</strong> <span id="video-fps">0.00</span></div>
          <div class="stat"><strong>Processing FPS:</strong> <span id="proc-fps">0.00</span></div>
          <div class="stat"><strong>ETA:</strong> <span id="eta">--:--</span></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <a id="manualExport" class="btn export" href="#" style="pointer-events:none;opacity:0.5;" target="_blank">Export CSV</a>
          <a id="downloadArchive" class="btn" href="#" style="background:#666;pointer-events:none;opacity:0.5;" target="_blank">Download Archive</a>
        </div>
      </div>
    </aside>
  </main>

  <footer>© 2025 Pothole Vision System</footer>

  <script>
    // --------------------------------------------------------
    // AUTOMATIC BACKEND DETECTION (Option A)
    // --------------------------------------------------------
    function detectBackend() {
      const host = window.location.hostname;

      if (host === "localhost" || host === "127.0.0.1" || window.location.protocol === "file:")
        return "http://127.0.0.1:7860";

      // Netlify, Vercel, or any domain
      if (host.endsWith(".netlify.app"))
        return "https://YOUR-HF-SPACE-NAME.hf.space"; // <--- EDIT ONCE ONLY

      // If running *inside* HuggingFace Space frontend:
      if (host.endsWith(".hf.space"))
        return window.location.origin;

      return "http://127.0.0.1:7860";
    }

    const backend = detectBackend();
    console.log("Using backend:", backend);

    let sessionId = null;

    const statusEl = document.getElementById("status");
    const videoFeed = document.getElementById("videoFeed");
    const manualExport = document.getElementById("manualExport");
    const downloadArchive = document.getElementById("downloadArchive");

    async function fetchJSON(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return { error: true };
        return res.json();
      } catch {
        return { error: true };
      }
    }

    function safeFixed(v, d=2) {
      v = Number(v);
      return isFinite(v) ? v.toFixed(d) : "0.00";
    }

    function formatETA(s) {
      if (!s || s < 0) return "--:--";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
    }

    function resetUI() {
      document.getElementById("detection-count").textContent = "0";
      document.getElementById("live-area").textContent = "0.00";
      document.getElementById("avg-conf").textContent = "0.00";
      document.getElementById("video-fps").textContent = "0.00";
      document.getElementById("proc-fps").textContent = "0.00";
      document.getElementById("eta").textContent = "--:--";
      videoFeed.src = "";
    }

    function retryStream() {
      if (sessionId) {
        videoFeed.src = `${backend}/video_feed/${sessionId}?t=${Date.now()}`;
      }
    }

    // ----------------------- UPLOAD HANDLER -----------------------
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const videoFile = document.getElementById("videoFile").files[0];
      if (!videoFile) return alert("Please select a video.");

      resetUI();

      manualExport.style.pointerEvents = "none";
      downloadArchive.style.pointerEvents = "none";
      manualExport.style.opacity = "0.5";
      downloadArchive.style.opacity = "0.5";

      statusEl.textContent = "Uploading...";

      const fd = new FormData();
      fd.append("video", videoFile);

      try {
        const res = await fetch(`${backend}/upload`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Idle";
          return alert("Upload failed: " + JSON.stringify(data));
        }

        sessionId = data.session_id;
        statusEl.textContent = "Processing...";

        retryStream();
      } catch (err) {
        console.error(err);
        alert("Upload failed.");
        statusEl.textContent = "Idle";
      }
    });

    // ----------------------- POLLING -----------------------
    async function refreshStats() {
      if (!sessionId) return;

      const det = await fetchJSON(`${backend}/detection_count/${sessionId}`);
      if (!det.error) {
        document.getElementById("detection-count").textContent = det.detections ?? 0;
        document.getElementById("live-area").textContent = safeFixed(det.total_area ?? 0);
        document.getElementById("avg-conf").textContent = safeFixed(det.avg_confidence ?? 0);
      }

      const prog = await fetchJSON(`${backend}/progress/${sessionId}`);
      if (!prog.error) {
        document.getElementById("video-fps").textContent = safeFixed(prog.video_fps ?? 0);
        document.getElementById("proc-fps").textContent = safeFixed(prog.processing_fps ?? 0);
        document.getElementById("eta").textContent = formatETA(prog.estimated_time_left_s);
      }

      const proc = await fetchJSON(`${backend}/processing_status/${sessionId}`);
      if (!proc.error) {
        statusEl.textContent = proc.processing ? "Processing..." : "Idle";
      }

      const last = await fetchJSON(`${backend}/last_report/${sessionId}`);
      if (!last.error && last.csv_url) {
        manualExport.href = backend + last.csv_url;
        manualExport.style.pointerEvents = "auto";
        manualExport.style.opacity = "1";
      }

      if (!last.error && last.archive_url) {
        downloadArchive.href = backend + last.archive_url;
        downloadArchive.style.pointerEvents = "auto";
        downloadArchive.style.opacity = "1";
      }
    }

    setInterval(refreshStats, 1000);
    refreshStats();
  </script>
</body>
</html>
