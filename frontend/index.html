<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Watch - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1d4ed8',
                        secondary: '#1e3a8a',
                        textMain: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar with Links -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <!-- Logo -->
            <a href="home.html" class="flex items-center gap-3 hover:opacity-80 transition">
                <div class="bg-slate-800 text-white p-1.5 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-map text-lg"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-900">Road Watch</span>
            </a>

            <!-- Quick Links -->
            <div class="flex items-center gap-4 text-sm font-medium">
                <a href="home.html" class="text-slate-500 hover:text-blue-600 transition">Home</a>
                <a href="about.html" class="text-slate-500 hover:text-blue-600 transition">About Us</a>
            </div>
        </div>
    </nav>

    <!-- Login Content -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <div class="p-8">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h1>
                    <p class="text-slate-500 text-sm">Sign in to access your road maintenance dashboard</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </div>
                            <input type="email" id="email" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm"
                                placeholder="inspector@city.gov">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm"
                                placeholder="********">
                        </div>
                        <div class="flex justify-end mt-1">
                            <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md flex items-center justify-center gap-2">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                    <p class="text-sm text-slate-500">
                        New Inspector?
                        <a href="about.html" class="font-medium text-blue-600 hover:text-blue-500">Learn about our mission</a>
                    </p>
                </div>
            </div>

            <div class="bg-gray-50 p-4 border-t border-gray-100 text-xs text-center text-slate-400">
                <p>Authorized personnel only. Secure connection.</p>
            </div>
        </div>
    </main>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button');

            // Simulate loading state
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';

            setTimeout(() => {
                // REDIRECT LOGIC: Redirects to the main landing page (home.html)
                // From there, the user can navigate to dashboard.html
                window.location.href = 'home.html';
            }, 1000);
        }
    </script>
</body>
</html>
